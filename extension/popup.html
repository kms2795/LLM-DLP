<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI DLP Guard</title>
<style>
  :root {
    --navy: #13203A;
    --paper: #FDFCF9;
    --line: #DCDFE5;
    --muted: #5B6577;
    --text: #3F4A5C;
    --accent: #A8500E;
    --accent-soft: #FBEFE4;
  }

  * { box-sizing: border-box; }

  body {
    width: 290px;
    margin: 0;
    padding: 18px;
    background: var(--paper);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Malgun Gothic", sans-serif;
  }

  h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; color: var(--navy); }
  .sub { margin: 0 0 16px; font-size: 12px; color: var(--muted); }

  .caption {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
  }

  /* ---- 입력 ---- */

  label.field { display: block; margin-bottom: 10px; }
  label.field span {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    color: var(--muted);
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font: 14px system-ui, -apple-system, "Malgun Gothic", sans-serif;
  }

  input.code { text-transform: uppercase; letter-spacing: 1px; }

  button.primary {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 7px;
    background: var(--navy);
    color: var(--paper);
    font: 600 14px system-ui, -apple-system, "Malgun Gothic", sans-serif;
    cursor: pointer;
  }

  button.primary:disabled { opacity: 0.5; cursor: default; }

  button.link {
    border: none;
    background: none;
    padding: 0;
    font: 12px system-ui, -apple-system, "Malgun Gothic", sans-serif;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
  }

  .switch { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--muted); }

  .msg { margin: 10px 0 0; font-size: 12px; line-height: 1.4; }
  .msg.error { color: var(--accent); }
  .msg.ok { color: #2F5FC9; }

  .hint { margin: 10px 0 0; font-size: 11px; line-height: 1.45; color: var(--muted); }

  /* ---- 로그인 후 ---- */

  .who { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .who b { font-weight: 600; color: var(--navy); }
  .org { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .role {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #EEF1F5;
    color: var(--muted);
  }

  .role.admin { background: var(--accent-soft); color: var(--accent); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .toggle-row span { font-weight: 600; color: var(--navy); }
  input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

  #state { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: var(--muted); }

  .types { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--text); }
  .types li {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #EEF0F3;
  }
  .types li:last-child { border-bottom: none; }
  .types b { font-weight: 600; color: var(--navy); }

  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #EEF1F5;
    color: var(--muted);
  }
  .tag.stop { background: var(--accent-soft); color: var(--accent); }

  .stats { display: flex; gap: 8px; }
  .stat { flex: 1; text-align: center; border-radius: 8px; padding: 10px 4px; background: #F2F4F7; }
  .stat b { display: block; font-size: 20px; color: var(--navy); }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat.high { background: var(--accent-soft); }
  .stat.high b { color: var(--accent); }

  body.off .card.dims { opacity: 0.45; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>AI DLP Guard</h1>
  <p class="sub">생성형 AI로 보내기 전에 개인정보를 가립니다</p>

  <!-- ===== 로그인 ===== -->
  <div id="loginView" hidden>
    <div class="card">
      <p class="caption">로그인</p>
      <label class="field">
        <span>아이디</span>
        <input type="text" id="username" autocomplete="username">
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" id="password" autocomplete="current-password">
      </label>
      <button class="primary" id="loginBtn">로그인</button>
      <p class="msg error" id="loginMsg" hidden></p>
      <p class="switch">계정이 없으신가요? <button class="link" id="toSignup">회원가입</button></p>
    </div>
    <p class="sub">로그인해야 탐지가 동작합니다.</p>
  </div>

  <!-- ===== 회원가입 ===== -->
  <div id="signupView" hidden>
    <div class="card">
      <p class="caption">회원가입</p>
      <label class="field">
        <span>아이디 (3자 이상)</span>
        <input type="text" id="suUsername" autocomplete="username">
      </label>
      <label class="field">
        <span>비밀번호 (8자 이상)</span>
        <input type="password" id="suPassword" autocomplete="new-password">
      </label>
      <label class="field">
        <span>조직 가입 코드</span>
        <input type="text" id="suCode" class="code" autocomplete="off" maxlength="20">
      </label>
      <button class="primary" id="signupBtn">가입하기</button>
      <p class="msg" id="signupMsg" hidden></p>
      <p class="hint">가입 코드는 소속 조직의 관리자에게 받으세요. 가입한 계정은 일반 사용자 권한입니다.</p>
      <p class="switch">이미 계정이 있으신가요? <button class="link" id="toLogin">로그인</button></p>
    </div>
  </div>

  <!-- ===== 로그인 후 ===== -->
  <div id="mainView" hidden>
    <div class="card">
      <div class="who">
        <span><b id="whoName">—</b> <span class="role" id="whoRole">—</span></span>
        <button class="link" id="logoutBtn">로그아웃</button>
      </div>
      <p class="org" id="whoOrg"></p>
    </div>

    <div class="card">
      <label class="toggle-row">
        <span>보호 켜기</span>
        <input type="checkbox" id="enabled">
      </label>
      <p id="state">전송 전에 6종을 검사합니다.</p>
    </div>

    <div class="card dims">
      <p class="caption">탐지 대상</p>
      <ul class="types">
        <li><b>주민번호 · API 키</b><span class="tag stop">확인 후 전송</span></li>
        <li><b>전화번호 · 주소</b><span class="tag">자동 가림</span></li>
        <li><b>이름 · 이메일</b><span class="tag">자동 가림</span></li>
      </ul>
    </div>

    <div class="card dims">
      <p class="caption">오늘 탐지</p>
      <div class="stats">
        <div class="stat high"><b id="statHigh">0</b><span>HIGH</span></div>
        <div class="stat"><b id="statMedium">0</b><span>MEDIUM</span></div>
        <div class="stat"><b id="statLow">0</b><span>LOW</span></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
