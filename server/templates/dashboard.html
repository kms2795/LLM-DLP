<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI DLP Guard 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --navy:#13203A; --paper:#FDFCF9; --line:#DCDFE5;
    --muted:#5B6577; --text:#3F4A5C; --accent:#A8500E; --soft:#FBEFE4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; background: #F2F4F7; color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  h1 { margin: 0; font-size: 22px; color: var(--navy); }
  .scope { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .who { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .who b { color: var(--navy); }
  .role { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: #E7EAEF; color: var(--muted); }
  .role.admin { background: var(--soft); color: var(--accent); }
  .who a { color: var(--muted); font-size: 13px; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px;
  }
  .card p { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--muted); }
  .card b { display: block; margin-top: 6px; font-size: 30px; color: var(--navy); }
  .card.high { background: var(--soft); border-color: var(--accent); }
  .card.high b { color: var(--accent); }

  .panel {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 14px; color: var(--navy); }
  .panel canvas { max-height: 240px; }
  .panel.wide canvas { max-height: 300px; }

  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .charts .panel { margin-bottom: 14px; }

  .nodata { padding: 60px 0; text-align: center; color: var(--muted); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #EEF0F3; vertical-align: top; }
  th { font-size: 12px; letter-spacing: .5px; color: var(--muted); white-space: nowrap; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.HIGH { background: var(--soft); color: var(--accent); }
  .pill.MEDIUM { background: #E4EBFA; color: #2F5FC9; }
  .pill.LOW { background: #E9ECF1; color: var(--muted); }
  .pill.NONE { background: #F0F1F3; color: #9AA4B5; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>탐지 로그 대시보드</h1>
      <p class="scope" id="scope">불러오는 중...</p>
    </div>
    <div class="who">
      <b>{{ user.username }}</b>
      <span class="role {% if user.role == 'admin' %}admin{% endif %}">
        {% if user.role == 'admin' %}관리자{% else %}일반{% endif %}
      </span>
      <a href="/dashboard/logout">로그아웃</a>
    </div>
  </header>

  <div class="cards">
    <div class="card"><p>전체</p><b id="cTotal">–</b></div>
    <div class="card high"><p>HIGH</p><b id="cHigh">–</b></div>
    <div class="card"><p>MEDIUM</p><b id="cMedium">–</b></div>
    <div class="card"><p>LOW</p><b id="cLow">–</b></div>
  </div>

  <div class="charts">
    <div class="panel"><h2>유형별 탐지</h2><div id="boxType"><canvas id="chType"></canvas></div></div>
    <div class="panel"><h2>위험도 분포</h2><div id="boxRisk"><canvas id="chRisk"></canvas></div></div>
  </div>

  <div class="panel wide">
    <h2>최근 7일</h2>
    <div id="boxDay"><canvas id="chDay"></canvas></div>
  </div>

  <div class="panel">
    <h2>최근 로그</h2>
    <div id="tableBox"><p class="empty">불러오는 중...</p></div>
  </div>

</div>

<script>
const ROLE = "{{ user.role }}";

const COLOR = {
  HIGH: "#A8500E", MEDIUM: "#2F5FC9", LOW: "#9AA4B5", NONE: "#DCDFE5",
  bar: "#2F5FC9", line: "#A8500E",
};

Chart.defaults.font.family = "system-ui, -apple-system, 'Malgun Gothic', sans-serif";
Chart.defaults.color = "#5B6577";

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
  );
}

// 데이터가 없으면 빈 축 대신 안내문을 보여줍니다
function nodata(boxId) {
  document.getElementById(boxId).innerHTML = '<p class="nodata">데이터가 없습니다</p>';
}

async function load() {
  const [sRes, lRes] = await Promise.all([fetch("/stats"), fetch("/logs?limit=50")]);

  if (sRes.status === 401 || lRes.status === 401) {
    location.href = "/dashboard/login";
    return;
  }

  const stats = await sRes.json();
  const logs = await lRes.json();

  document.getElementById("scope").textContent =
    stats.scope === "org" ? (stats.org ? stats.org + " 전체 로그" : "조직 전체 로그") : "내 로그만";

  const risk = stats.by_risk || {};
  document.getElementById("cTotal").textContent = stats.total ?? 0;
  document.getElementById("cHigh").textContent = risk.HIGH ?? 0;
  document.getElementById("cMedium").textContent = risk.MEDIUM ?? 0;
  document.getElementById("cLow").textContent = risk.LOW ?? 0;

  drawType(stats.by_type || {});
  drawRisk(risk);
  drawDay(stats.by_day || []);
  drawTable(logs);
}

function drawType(byType) {
  const entries = Object.entries(byType).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return nodata("boxType");

  new Chart(document.getElementById("chType"), {
    type: "bar",
    data: {
      labels: entries.map((e) => e[0]),
      datasets: [{ data: entries.map((e) => e[1]), backgroundColor: COLOR.bar, borderRadius: 4 }],
    },
    options: {
      indexAxis: "y",
      plugins: { legend: { display: false } },
      scales: { x: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });
}

function drawRisk(byRisk) {
  const order = ["HIGH", "MEDIUM", "LOW", "NONE"].filter((k) => byRisk[k]);
  if (!order.length) return nodata("boxRisk");

  new Chart(document.getElementById("chRisk"), {
    type: "doughnut",
    data: {
      labels: order,
      datasets: [{ data: order.map((k) => byRisk[k]), backgroundColor: order.map((k) => COLOR[k]) }],
    },
    options: { plugins: { legend: { position: "bottom" } } },
  });
}

// 탐지가 0건인 날은 서버가 안 돌려주므로, 7일치를 채워서 그립니다
function drawDay(byDay) {
  if (!byDay.length) return nodata("boxDay");

  const counts = {};
  for (const d of byDay) counts[d.date] = d.count;

  const labels = [];
  const values = [];
  const today = new Date();

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    const pad = (n) => String(n).padStart(2, "0");
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    labels.push(key.slice(5));
    values.push(counts[key] || 0);
  }

  new Chart(document.getElementById("chDay"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: COLOR.line, backgroundColor: COLOR.line,
        tension: 0.3, pointRadius: 4,
      }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
    },
  });
}

function drawTable(logs) {
  const box = document.getElementById("tableBox");

  if (!logs.length) {
    box.innerHTML = '<p class="empty">아직 기록이 없습니다.</p>';
    return;
  }

  const showUser = ROLE === "admin";

  const head =
    "<tr><th>시각</th>" +
    (showUser ? "<th>사용자</th>" : "") +
    "<th>위험도</th><th>탐지 유형</th><th>마스킹본</th><th>탐지값</th></tr>";

  const rows = logs.map((l) => {
    const t = l.detected_at ? l.detected_at.replace("T", " ").slice(0, 19) : "";
    return (
      "<tr>" +
      `<td class="mono">${esc(t)}</td>` +
      (showUser ? `<td>${esc(l.username || "-")}</td>` : "") +
      `<td><span class="pill ${esc(l.risk_level)}">${esc(l.risk_level)}</span></td>` +
      `<td>${esc(l.detected_type || "-")}</td>` +
      `<td class="mono">${esc(l.masked_text)}</td>` +
      `<td class="mono">${esc(l.evidence || "-")}</td>` +
      "</tr>"
    );
  });

  box.innerHTML = "<table>" + head + rows.join("") + "</table>";
}

load();
</script>
</body>
</html>
